name: Update Formula

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to update (latest, next, dev, or all)'
        required: false
        default: 'all'
      version:
        description: 'Force a specific version (only valid when channel is a single channel)'
        required: false
  schedule:
    - cron: '17 * * * *'  # hourly; GitHub often delays/drops scheduled runs, so poll more often than needed

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: latest
            version_pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
            formula: Formula/happier.rb
          - channel: next
            version_pattern: '-preview\.[0-9]+$'
            formula: Formula/happier-next.rb
          - channel: dev
            version_pattern: '-dev\.[0-9]+$'
            formula: Formula/happier-dev.rb
    steps:
      - name: Skip non-matching channel
        if: github.event.inputs.channel != '' && github.event.inputs.channel != 'all' && github.event.inputs.channel != matrix.channel
        run: |
          echo "Skipping ${{ matrix.channel }} (input requested ${{ github.event.inputs.channel }})"
          echo "SKIP=true" >> "$GITHUB_ENV"

      - name: Checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v4

      - name: Resolve version
        if: env.SKIP != 'true'
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.channel }}" = "${{ matrix.channel }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Resolve from the versioned cli-v* tags rather than the rolling cli-stable/preview/dev
            # releases, which upstream does not always update (e.g. cli-dev stayed on dev.2 after dev.3).
            # Take the highest version whose checksums file is published (assets may still be uploading).
            VERSION=""
            for v in $(gh api "repos/happier-dev/happier/git/matching-refs/tags/cli-v" --jq '.[].ref' \
                | sed 's#^refs/tags/cli-v##' | grep -E -e '${{ matrix.version_pattern }}' | sort -rV | head -5); do
              if curl -sfIL -o /dev/null "https://github.com/happier-dev/happier/releases/download/cli-v${v}/checksums-happier-v${v}.txt"; then
                VERSION="$v"; break
              fi
              echo "cli-v${v}: checksums not published yet, trying older"
            done
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CURRENT=$(grep '^\s*version ' "${{ matrix.formula }}" | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not resolve version for ${{ matrix.channel }}"; exit 1
          fi
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)
          if [ -z "${{ github.event.inputs.version }}" ] && [ "$NEWEST" != "$VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.channel }}: formula v${CURRENT} is newer than resolved v${VERSION}, skipping."
          elif [ "$CURRENT" = "$VERSION" ] && ! grep -q 'sha256 ""' "${{ matrix.formula }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.channel }}: already at v${VERSION}, skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.channel }}: updating from v${CURRENT} to v${VERSION}"
          fi

      - name: Fetch checksums
        if: env.SKIP != 'true' && steps.resolve.outputs.skip == 'false'
        id: checksums
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          BASE="https://github.com/happier-dev/happier/releases/download/cli-v${VERSION}"
          SUMS=$(curl -sfL "${BASE}/checksums-happier-v${VERSION}.txt")
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            # Match the exact CLI tarball name; the checksums file also lists
            # memory-runtime, difftastic and json assets for each platform.
            SHA=$(echo "$SUMS" | awk -v f="happier-v${VERSION}-${platform}.tar.gz" '$2 == f {print $1}')
            if ! echo "$SHA" | grep -qE '^[a-f0-9]{64}$'; then
              echo "::error::Missing/invalid checksum for ${platform} (v${VERSION})"; exit 1
            fi
            echo "${platform//-/_}=$SHA" >> "$GITHUB_OUTPUT"
          done

      - name: Update formula
        if: env.SKIP != 'true' && steps.resolve.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          FORMULA="${{ matrix.formula }}"
          python3 - <<EOF
          import re, pathlib, os
          p = pathlib.Path("${FORMULA}")
          s = p.read_text()
          s = re.sub(r'version "[^"]+"', f'version "${VERSION}"', s, count=1)
          sums = {
            "darwin-arm64": "${{ steps.checksums.outputs.darwin_arm64 }}",
            "darwin-x64":   "${{ steps.checksums.outputs.darwin_x64 }}",
            "linux-arm64":  "${{ steps.checksums.outputs.linux_arm64 }}",
            "linux-x64":    "${{ steps.checksums.outputs.linux_x64 }}",
          }
          for platform, sha in sums.items():
            s = re.sub(
              r'(' + re.escape(platform) + r'\.tar\.gz"\s*\n\s*sha256 ")[a-f0-9]*(")',
              r'\g<1>' + sha + r'\g<2>',
              s,
            )
          p.write_text(s)
          EOF
          if grep -q 'sha256 ""' "${FORMULA}"; then
            echo "::error::Formula still has empty sha256"; exit 1
          fi

      - name: Commit and push
        if: env.SKIP != 'true' && steps.resolve.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.formula }}"
          git commit -m "Update happier (${{ matrix.channel }}) to v${{ steps.resolve.outputs.version }}"
          git pull --rebase
          git push
